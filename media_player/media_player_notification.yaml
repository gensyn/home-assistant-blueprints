blueprint:
  name: Media Player Notification
  description: >
    Creates a persistent actionable notification for a media player. The
    notification is shown while playing or paused, updated when the track
    changes, recreated after notification actions, and cleared after the
    configured paused or idle timeout.
  domain: automation

  input:
    media_player:
      name: Media player
      description: Media player to monitor and control.
      selector:
        entity:
          filter:
            - domain: media_player

    notify_targets:
      name: Notification targets
      description: >
        One or more notify service names without the notify. prefix.
        For example: chandler or mobile_app_pixel_7.
      selector:
        text:
          multiple: true

    action_prefix:
      name: Action prefix
      description: >
        Unique prefix for notification actions and the notification tag.
        Use a different prefix for each media-player notification automation.
      default: media_player
      selector:
        text:

    clear_delay:
      name: Clear delay
      description: >
        How long the player must remain paused or idle before the notification
        is cleared.
      default:
        hours: 0
        minutes: 10
        seconds: 0
      selector:
        duration:

    notification_icon:
      name: Notification icon
      default: mdi:speaker
      selector:
        icon:

    only_group_leader:
      name: Only notify for the group leader
      description: >
        If enabled, notifications are sent only when this player is the first
        member of its media-player group.
      default: false
      selector:
        boolean:

mode: queued
max: 10
max_exceeded: silent

variables:
  player: !input media_player
  notify_targets: !input notify_targets
  prefix: !input action_prefix
  icon: !input notification_icon
  group_leader_only: !input only_group_leader

  notification_tag: "media_{{ prefix }}"

  is_group_leader: >-
    {% set members = state_attr(player, 'group_members') %}
    {{
      not group_leader_only
      or members is none
      or members | count == 0
      or members[0] == player
    }}

triggers:
  - id: playing
    trigger: state
    entity_id: !input media_player
    to: playing

  - id: paused
    trigger: state
    entity_id: !input media_player
    from: playing
    to:
      - paused
      - idle

  - id: track_changed
    trigger: state
    entity_id: !input media_player
    attribute: media_title

  - id: clear
    trigger: state
    entity_id: !input media_player
    to:
      - paused
      - idle
    for: !input clear_delay

  - id: stopped
    trigger: state
    entity_id: !input media_player
    to:
      - "off"
      - standby
      - unavailable
      - unknown

  - id: notification_action
    trigger: event
    event_type: mobile_app_notification_action

conditions: []

actions:
  # Handle the event that started this automation run.
  - choose:
      # ---------------------------------------------------------------
      # Playing or track changed
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id:
              - playing
              - track_changed

          - condition: state
            entity_id: !input media_player
            state: playing

          - condition: template
            value_template: "{{ is_group_leader | bool }}"

        sequence:
          # Some media players change to playing before their metadata is
          # available.
          - wait_template: >-
              {{
                state_attr(player, 'media_title') is not none
                or state_attr(player, 'media_artist') is not none
              }}
            timeout:
              seconds: 10
            continue_on_timeout: true

      # ---------------------------------------------------------------
      # Paused
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: paused

          - condition: template
            value_template: "{{ is_group_leader | bool }}"

        sequence: []

      # ---------------------------------------------------------------
      # Notification button action
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: notification_action

          - condition: template
            value_template: "{{ is_group_leader | bool }}"

          - condition: template
            value_template: >-
              {{
                trigger.event.data.action | default('') in [
                  prefix ~ '_play',
                  prefix ~ '_pause',
                  prefix ~ '_volume_down',
                  prefix ~ '_volume_up'
                ]
              }}

        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ trigger.event.data.action == prefix ~ '_play' }}
                sequence:
                  - action: media_player.media_play
                    target:
                      entity_id: !input media_player

              - conditions:
                  - condition: template
                    value_template: >-
                      {{ trigger.event.data.action == prefix ~ '_pause' }}
                sequence:
                  - action: media_player.media_pause
                    target:
                      entity_id: !input media_player

              - conditions:
                  - condition: template
                    value_template: >-
                      {{ trigger.event.data.action == prefix ~ '_volume_down' }}
                sequence:
                  - action: media_player.volume_down
                    target:
                      entity_id: !input media_player

              - conditions:
                  - condition: template
                    value_template: >-
                      {{ trigger.event.data.action == prefix ~ '_volume_up' }}
                sequence:
                  - action: media_player.volume_up
                    target:
                      entity_id: !input media_player

          # The mobile app dismisses the notification when an action is
          # pressed. Allow the media player state to update before recreating it.
          - delay:
              milliseconds: 50

      # ---------------------------------------------------------------
      # Clear the notification
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id:
              - clear
              - stopped

        sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "notify.{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ notification_tag }}"

          - stop: Notification cleared

    default:
      - stop: Ignored trigger

  # For a play action, wait for the player to become playing and expose
  # metadata before rendering the replacement notification.
  - if:
      - condition: state
        entity_id: !input media_player
        state: playing
    then:
      - wait_template: >-
          {{
            state_attr(player, 'media_title') is not none
            or state_attr(player, 'media_artist') is not none
          }}
        timeout:
          seconds: 10
        continue_on_timeout: true

  # Do not recreate a notification for a track change while paused, or for
  # an action when the player is neither playing nor paused/idle.
  - condition: template
    value_template: >-
      {{
        (
          trigger.id in ['playing', 'paused', 'notification_action']
          and states(player) in ['playing', 'paused', 'idle']
        )
        or
        (
          trigger.id == 'track_changed'
          and is_state(player, 'playing')
        )
      }}

  - condition: template
    value_template: "{{ is_group_leader | bool }}"

  # Read metadata after any wait and after any media-player action.
  - variables:
      current_artist: "{{ state_attr(player, 'media_artist') or '' }}"
      current_track: "{{ state_attr(player, 'media_title') or '' }}"
      current_title: >-
        {% if current_artist and current_track %}
          {{ current_artist }} - {{ current_track }}
        {% elif current_artist %}
          {{ current_artist }}
        {% elif current_track %}
          {{ current_track }}
        {% else %}
          {{ state_attr(player, 'app_name') or 'Media' }}
        {% endif %}
      current_message: >-
        {{ state_attr(player, 'friendly_name') or player }}
      current_artwork: "{{ state_attr(player, 'entity_picture') }}"

  # ---------------------------------------------------------------
  # Recreate the notification using the current player state
  # ---------------------------------------------------------------
  - choose:
      # Playing notification
      - conditions:
          - condition: state
            entity_id: !input media_player
            state: playing

        sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "notify.{{ repeat.item }}"
                  data:
                    title: "{{ current_title }}"
                    message: "{{ current_message }}"
                    data:
                      persistent: true
                      sticky: true
                      tag: "{{ notification_tag }}"
                      notification_icon: "{{ icon }}"
                      channel: Media
                      group: media
                      importance: low
                      image: "{{ current_artwork }}"
                      actions:
                        - action: "{{ prefix }}_pause"
                          title: " ⏸️"
                        - action: "{{ prefix }}_volume_down"
                          title: " 🔉"
                        - action: "{{ prefix }}_volume_up"
                          title: " 🔊"

      # Paused or idle notification
      - conditions:
          - condition: state
            entity_id: !input media_player
            state:
              - paused
              - idle

        sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "notify.{{ repeat.item }}"
                  data:
                    title: "{{ current_title }}"
                    message: "{{ current_message }}"
                    data:
                      persistent: true
                      sticky: true
                      tag: "{{ notification_tag }}"
                      notification_icon: "{{ icon }}"
                      channel: Media
                      group: media
                      importance: low
                      image: "{{ current_artwork }}"
                      actions:
                        - action: "{{ prefix }}_play"
                          title: " ▶️"
